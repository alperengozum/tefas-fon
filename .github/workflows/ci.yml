name: ci
on:
  pull_request:
  push:
    branches: [main]

# DB gerektirmeyen hızlı kontroller: tip denetimi + birim testleri (e2e ayrı iş akışında)
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
