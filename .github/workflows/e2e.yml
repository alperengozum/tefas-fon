name: e2e
on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: tefas, POSTGRES_PASSWORD: tefas, POSTGRES_DB: tefas }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tefas" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://tefas:tefas@localhost:5432/tefas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium-headless-shell
      - name: Şema + sahte veri
        run: |
          node scripts/ingest.mjs init
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f e2e/seed.sql
          node scripts/ingest.mjs vol
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: test-results, retention-days: 7 }
